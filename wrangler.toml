# Cloudflare Workers + static assets via the OpenNext adapter
# (the supported successor to @cloudflare/next-on-pages).
name = "admission-ventures"
main = ".open-next/worker.js"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"
